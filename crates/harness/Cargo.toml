[package]
name = "dominion-harness"
version = "0.1.0"
edition = "2021"
description = "Independent agent harness core for DOMINION: loop, tools, permissions, context budget."
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
serde_json = "1"
