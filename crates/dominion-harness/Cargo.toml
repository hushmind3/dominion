[package]
name = "dominion-harness"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native runtime admission, ordered dispatch, durable receipts and host execution port"

[dependencies]
dominion-contracts = { path = "../dominion-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
