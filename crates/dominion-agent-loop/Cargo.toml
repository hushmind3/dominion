[package]
name = "dominion-agent-loop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pluggable ReAct and Plan-and-Execute algorithms using the Dominion core host ports"

[dependencies]
dominion-turn-core = { path = "../dominion-turn-core" }
dominion-agent-kernel = { path = "../dominion-agent-kernel" }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros","rt"] }
