[package]
name = "dominion-core"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Dominion native Rust harness, hosted by the product SQLite/tool/model adapters"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
sha2 = "0.10"
