[package]
name = "dominion-agent-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "DOMINION-owned autonomous Rust agent kernel; model and tool provider independent"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
