[package]
name = "dominion-agent-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "DOMINION-owned autonomous Rust agent kernel; model and tool provider independent"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[dependencies]
serde_json = "1"
dominion-agent-runtime = { path = "../dominion-agent-runtime" }
dominion-agent-algorithms = { path = "../dominion-agent-algorithms" }
