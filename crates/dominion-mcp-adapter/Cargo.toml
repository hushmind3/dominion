[package]
name = "dominion-mcp-adapter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Optional MCP stdio connector for the DOMINION SDK"
[dependencies]
dominion-agent-sdk = { path = "../dominion-agent-sdk", version = "0.1.0" }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "macros"] }
