[project]
name = "dominion-voice-agent"
version = "0.1.0"
description = "LiveKit voice agent that connects Dominion to local whisper.cpp, llama.cpp and Piper."
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[silero]>=1.9,<2",
    "livekit-plugins-openai>=1.9,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "piper-tts>=1.8",
    "httpx>=0.29.0",
    "python-multipart>=0.0.34",
]

[tool.uv]
package = false
