name: Sub3 Rust SDK tests

on:
  push:
    branches: [dominion-sub3]
    paths:
      - '.github/workflows/sub3-rust-sdk-check.yml'
      - 'crates/dominion-agent-sdk/**'
      - 'src/api/jobs.rs'
      - 'src/api/sdk_runs.rs'
      - 'src/engine/native_agent.rs'
      - 'src/engine/algorithms.rs'
      - 'src/engine/native_model.rs'
      - 'src/engine/native_cache.rs'
      - 'src/engine/native_routing.rs'
      - 'src/engine/native_stream.rs'
      - 'src/engine/native_codex_ws.rs'
      - 'src/engine/chat/**'
      - 'src/engine/mcp.rs'
      - 'src/engine/github_files.rs'
      - 'src/engine/github_workflow.rs'
      - 'src/engine/google_workspace.rs'
      - 'src/engine/tools.rs'
      - 'src/engine/oauth.rs'
      - 'src/api/cli_oauth.rs'
      - 'src/api/collections.rs'
      - 'src/state.rs'
      - 'src/engine/workflows.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sub3-rust-sdk-verify
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: SDK kernel and replay Rust tests (dev profile only)
        run: |
          cargo test -p dominion-agent-sdk --lib
          cargo test --bin dominion-rust engine::native_evidence::tests
          cargo test -p dominion-agent-sdk --test kernel_replanning
          cargo test --bin dominion-rust engine::chat::kernel_bridge::tests
          cargo test --bin dominion-rust api::sdk_runs::tests
          cargo test --bin dominion-rust engine::algorithms::tests
          cargo test --bin dominion-rust engine::program::tests
          cargo test --bin dominion-rust db::tests
          cargo test --bin dominion-rust engine::native_agent::tests
