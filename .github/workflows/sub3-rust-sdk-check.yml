name: Sub3 Rust SDK tests

on:
  push:
    branches: [dominion-sub3]
    paths:
      - '.github/workflows/sub3-rust-sdk-check.yml'
      - 'crates/dominion-agent-sdk/**'
      - 'crates/dominion-agent-runtime/**'
      - 'crates/dominion-agent-algorithms/**'
      - 'sdk/rust/**'
      - 'src/host/**'
      - 'src/storage/**'
      - 'src/conversation/**'
      - 'src/features/providers/**'
      - 'src/features/cognition/profiles.rs'
      - 'src/integrations/**'
      - 'src/api/jobs.rs'
      - 'src/api/sdk_runs.rs'
      - 'src/api/sdk.rs'
      - 'src/api/cli_oauth.rs'
      - 'src/api/collections.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sub3-rust-sdk-verify
  cancel-in-progress: true

jobs:
  rust:
    # Pure Rust kernel/API checks: use the fast Linux runner. Tauri macOS and
    # Windows packaging have separate release workflows.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: SDK-only kernel, replay and transport tests (dev profile only)
        run: |
          cargo test -p dominion-agent-runtime --lib
          cargo test -p dominion-agent-algorithms --lib
          cargo test -p dominion-agent-sdk --lib
          cargo test -p dominion-sdk --lib
          cargo test -p dominion-agent-sdk --test kernel
          cargo test -p dominion-agent-sdk --test kernel_replanning
          cargo test -p dominion-agent-sdk --test algorithm_policy_injection
          cargo test --bin dominion-rust features::cognition::profiles::tests
          cargo test --bin dominion-rust api::jobs::algorithm_profile_api_tests
          cargo test --bin dominion-rust conversation::chat::kernel_bridge::tests
          cargo test --bin dominion-rust api::sdk_runs::tests
          cargo test --bin dominion-rust features::providers::native_stream::tests
          cargo test --bin dominion-rust native_stream_chat_http_fragmented_calls_are_durable_and_unexecuted
