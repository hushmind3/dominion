name: Sub3 Rust SDK focused verification

# A narrow isolated compiler/test check, NOT the full Dominion release CI.
# Only SDK source and this workflow trigger it; the regular repo CI excludes
# dominion-sub3 and remains untouched.
on:
  push:
    branches: [dominion-sub3]
    paths:
      - '.github/workflows/sub3-rust-sdk-check.yml'
      - 'crates/dominion-agent-sdk/**'
      - 'src/api/jobs.rs'
      - 'src/engine/native_agent.rs'
      - 'src/engine/native_model.rs'
      - 'src/engine/native_cache.rs'
      - 'src/engine/native_routing.rs'
      - 'src/api/providers.rs'
      - 'web/src/pages/Models.tsx'
      - 'src/engine/gateway.rs'
      - 'src/engine/native_stream.rs'
      - 'src/engine/native_codex_ws.rs'
      - 'sdk/typescript/**'
      - 'src/engine/chat/codex_ws.rs'
      - 'src/engine/chat/provider.rs'
      - 'src/engine/workflows.rs'
      - 'src/engine/jobs.rs'
      - 'src/engine/rsi.rs'
      - 'src/engine/rsi_evolve.rs'
      - 'src/engine/rsi_worktree.rs'
      - 'src/api/rsi.rs'
      - 'src/api/mod.rs'
      - 'src/api/sdk_runs.rs'
      - 'scripts/rsi-lab.mjs'
      - 'scripts/rsi-measure.mjs'
      - 'scripts/rsi-lab.test.mjs'
      - 'web/src/components/NativeAgentPanel.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sub3-rust-sdk-verify
  cancel-in-progress: true

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile and execute Rust SDK tests, including real file and shell repair
        run: cargo test --manifest-path crates/dominion-agent-sdk/Cargo.toml -- --nocapture
      - name: Compile full Dominion Rust host and run native adapter contract tests
        run: cargo test --manifest-path Cargo.toml --bin dominion-rust native_ -- --nocapture
      - name: RSI actual source editing, frozen Git tree and descendant recovery
        run: |
          cargo test --manifest-path Cargo.toml --bin dominion-rust engine::rsi::tests -- --nocapture
          cargo test --manifest-path Cargo.toml --bin dominion-rust engine::rsi_worktree::tests -- --nocapture
          cargo test --manifest-path Cargo.toml --bin dominion-rust engine::rsi_evolve::tests -- --nocapture
          cargo test --manifest-path Cargo.toml --bin dominion-rust api::rsi::tests -- --nocapture
          cargo test --manifest-path Cargo.toml --bin dominion-rust api::sdk_runs::tests -- --nocapture
      - name: Verify interactive Codex WebSocket continuity separately (native job fixtures above)
        run: cargo test --manifest-path Cargo.toml --bin dominion-rust engine::chat::codex_ws::tests -- --nocapture
      - name: Test replay-safe workflow step recovery through host storage
        run: cargo test --manifest-path Cargo.toml --bin dominion-rust recover_new_workflow_reuses_durable_rust_sdk_child -- --nocapture
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compile the actual main-based GUI against the Rust job API client
        run: |
          npm ci --prefix web
          npm run typecheck --prefix web
          npm run build --prefix web
      - name: Real Rust frozen paired A/B runner and failure-worktree cleanup
        run: node --test scripts/rsi-lab.test.mjs
      - name: Build and test the published-surface TypeScript SDK independently
        run: |
          npm install --prefix sdk/typescript --no-package-lock --ignore-scripts --no-audit
          npm test --prefix sdk/typescript
