name: Sub3 voice companion contracts
on:
  push:
    branches: [dominion-sub3]
    paths:
      - 'plugins/dominion-voice/**'
      - 'src/api/plugins/recipe.rs'
      - '.github/workflows/sub3-voice-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sub3-voice-contracts
  cancel-in-progress: true
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Offline protocol tests
        run: |
          python3 -m unittest discover -s plugins/dominion-voice -p 'test_*.py'
          python3 -m py_compile plugins/dominion-voice/*.py
          node --check plugins/dominion-voice/app.js
      - name: Build actual voice image
        run: docker build -t dominion-voice-ci:check plugins/dominion-voice
      - name: Import pinned voice and SIP APIs
        run: |
          docker run --rm --entrypoint python dominion-voice-ci:check -c 'from pipecat.pipeline.worker import PipelineWorker, PipelineParams; from pipecat.workers.runner import WorkerRunner; from pipecat.services.cartesia.tts import CartesiaTTSService; from pipecat.services.deepgram.stt import DeepgramSTTService; from pipecat.transports.livekit.transport import LiveKitTransport; from livekit import api; from google.protobuf.duration_pb2 import Duration; api.CreateSIPParticipantRequest(sip_trunk_id="ST_test",sip_call_to="+821012345678",room_name="test",ringing_timeout=Duration(seconds=30),max_call_duration=Duration(seconds=600)); api.VideoGrants(room_join=True,room="test",can_publish_sources=["microphone"]); assert hasattr(api.ParticipantInfo,"SIP")'
      - name: Real container HTTP/authentication smoke
        run: |
          docker run -d --name voice-ci --read-only --tmpfs /tmp:rw,nosuid,nodev,size=128m --cap-drop ALL --security-opt no-new-privileges:true --memory=2g --cpus=2 -e DOMINION_BRIDGE_TOKEN=test-only -p 127.0.0.1:18780:8080 dominion-voice-ci:check
          trap 'docker logs voice-ci; docker rm -f voice-ci' EXIT
          curl --retry 10 --retry-connrefused --fail http://127.0.0.1:18780/ -o /tmp/voice.html
          grep -q '휴대폰 연결' /tmp/voice.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18780/dominion/v1/request)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer test-only' http://127.0.0.1:18780/dominion/v1/request)" = 204
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Native client type and Expo configuration
        working-directory: plugins/dominion-voice/mobile
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run typecheck
          npx expo config --type public
