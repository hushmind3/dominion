name: Sub3 fast architecture and integration checks

on:
  push:
    branches: [dominion-sub3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sub3-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Source contracts and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-runtime-architecture.mjs
      - run: node --check web/e2e/sub3-native-live.mjs
      - run: node --check scripts/mcp-echo-modern-server.mjs
      - run: npm install --prefix sdk/typescript --no-package-lock --ignore-scripts --no-audit
      - run: npm test --prefix sdk/typescript

  rust:
    name: Rust all-target compile and SDK regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
      # Distinguish the product binary failure from test-only compilation.
      - run: cargo check --locked --bin dominion-rust
      - run: cargo test --locked --workspace --no-run
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --test e2e health_reports_running_binary_identity_instead_of_moving_checkout_head -- --exact web_api::health_reports_running_binary_identity_instead_of_moving_checkout_head
      - run: cargo test --locked --bin dominion-rust real_modern_stdio_never_initializes_and_persists_one_live_process
      - run: cargo test --locked --bin dominion-rust modern_mcp_http_uses_discovery_stateless_headers_and_live_pinned_schema
      - run: cargo test --locked --bin dominion-rust modern_mcp_auth_failure_does_not_fall_back_to_initialize
      - run: cargo test --locked --bin dominion-rust http_reuses_mcp_session_and_reconnects_after_credential_rotation
      - run: cargo test --locked --bin dominion-rust stdio_reuses_one_live_mcp_process_and_rotates_on_config_change
      - run: cargo test --locked -p dominion-agent-runtime --lib
      - run: cargo test --locked -p dominion-agent-sdk --lib
      - run: cargo test --locked --bin dominion-rust unknown_paid_generation_is_needs_review_even_after_owner_cancel
      - run: cargo test --locked --bin dominion-rust unknown_tool_effect_blocks_a_successful_final_answer
      - run: cargo test --locked --bin dominion-rust cancelled_paid_dispatch_only_relabels_as_review_with_both_durable_fences
      - run: cargo test --locked --bin dominion-rust cancelled_completed_task_never_reopens_on_unproven_review_claim
      - run: cargo test --locked --bin dominion-rust sub3_standalone_explanation_uses_zero_tool_schemas_over_real_http_sse

  quality-diagnostics:
    name: Rust format and Clippy diagnostics (migration report)
    # This isolated job reports debt without claiming a zero-warning codebase.
    # After the entire workspace is reformatted, remove step-level tolerance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Workspace rustfmt
        run: cargo fmt --all -- --check
        continue-on-error: true
      - name: Rust Clippy all targets
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        continue-on-error: true

  web:
    name: TypeScript and Vite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run build --prefix web
