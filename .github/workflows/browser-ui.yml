name: Browser UI verification
on:
  pull_request:
  push:
    branches: [main]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build production frontend
        run: npm run build
      - name: Confirm headless browser is available
        run: command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Open pages and test interactions
        run: node tests/ui-browser-smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dominion-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
