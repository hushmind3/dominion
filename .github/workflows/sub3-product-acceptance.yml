name: Sub3 product Rust tests

on:
  push:
    branches: [dominion-sub3]
    paths:
      - '.github/workflows/sub3-product-acceptance.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'src/**'
      - 'sdk/**'
      - 'web/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sub3-product-acceptance
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Harness and product contract tests (dev profile only)
        run: |
          node scripts/check-lean-product.mjs
          test ! -d crates/harness
          ! grep -q 'dominion-harness' Cargo.toml
          ! grep -q 'dominion_harness::' src/api/sdk.rs
          # A successful Rust build must not resurrect extra paid reviewer
          # calls or a second unversioned tool selector in the chat runtime.
          ! grep -Fq 'review_action(' src/engine/chat/runtime/turn.rs
          ! grep -Fq 'review_action(' src/engine/chat/runtime/planning.rs
          grep -Fq 'pub use tool_discovery::tool_relevance;' crates/dominion-agent-sdk/src/lib.rs
          grep -Fq 'dominion_agent_sdk::tool_relevance(' src/engine/chat/runtime/selection.rs
          cargo test --bin dominion-rust engine::skill_discovery::tests
          cargo test --bin dominion-rust engine::chat::runtime::capability::tests
          cargo test --bin dominion-rust planning_cost_tests
          cargo test --bin dominion-rust shared_sdk_relevance_ignores_tool_parameter_payload
          cargo test --bin dominion-rust engine::chat::tests
          # Keep native nine-participant routing, examples and @mentions honest.
          cargo test --bin dominion-rust engine::rooms::tests
          # Latest main provider UI depends on public, keyless model browsing.
          cargo test --bin dominion-rust api::providers::tests
          cargo test --bin dominion-rust api::cli_oauth::tests
          # Chained developer persona must appear exactly once on the WS wire.
          cargo test --bin dominion-rust engine::chat::codex_ws::tests
          cargo test --bin dominion-rust room_catalog_cache_tests
          # Real local mock SSE wire: no repeated prefill for known KV backends,
          # with full owner/persona context preserved on the stateless wire.
          cargo test --bin dominion-rust local_kv_cache_is_vendor_scoped_never_general_openai_compat
          cargo test --bin dominion-rust managed_llama_server_uses_real_chat_wire_prefix_kv_cache
          cargo test --bin dominion-rust cancel_api_interrupts_silent_http_generation_and_allows_same_session_retry
          cargo test --bin dominion-rust engine::chat::runtime::cancellation_watch_tests
          cargo test --bin dominion-rust engine::chat::room_context::tests
          cargo test --bin dominion-rust engine::chat::continuity::tests
          cargo test --bin dominion-rust engine::room_state::tests
          cargo test --bin dominion-rust engine::verification
          # Audit-relevant regressions: canonical provider route, source index,
          # and bounded conversation checkpoints now get their own test filters.
          cargo test --bin dominion-rust engine::chat::provider::tests
          cargo test --bin dominion-rust engine::code_index::tests
          cargo test --bin dominion-rust engine::compact::token_budget_tests
          cargo test --bin dominion-rust db::tests
          cargo test --bin dominion-rust engine::native_evidence::tests
          cargo test --bin dominion-rust engine::native_replay::tests
          cargo test --bin dominion-rust api::native_replay::tests
          cargo test --bin dominion-rust engine::program::tests
          cargo test --bin dominion-rust engine::algorithms::tests
          cargo test --bin dominion-rust engine::adaptation_loop::tests
          cargo test --bin dominion-rust engine::chat::runtime::program::evidence_join_tests
          cargo test --bin dominion-rust engine::chat::runtime::program::recovery_tests
          cargo test --bin dominion-rust engine::native_adjudication::tests
          cargo test --bin dominion-rust engine::native_agent::tests
          cargo test --bin dominion-rust api::sdk::tests
          cargo test --test e2e native_job_prompt_runs -- --test-threads=1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Chat stop UI type safety and production compilation
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run typecheck --prefix web
          node --experimental-strip-types --test web/tests/*.test.mjs
          npm run build --prefix web
      - name: SDK client type contracts and HTTP transport tests
        run: |
          npm install --prefix sdk/typescript --no-package-lock --ignore-scripts --no-audit --no-fund
          npm test --prefix sdk/typescript
