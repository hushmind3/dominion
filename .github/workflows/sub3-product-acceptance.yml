name: Sub3 product Rust tests

on:
  push:
    branches: [dominion-sub3]
    paths:
      - '.github/workflows/sub3-product-acceptance.yml'
      - 'Cargo.toml'
      - 'crates/dominion-agent-sdk/**'
      - 'crates/harness/**'
      - 'src/api/sdk.rs'
      - 'src/api/mod.rs'
      - 'tests/e2e.rs'
      - 'src/engine/chat/**'
      - 'scripts/check-lean-product.mjs'
      - 'src/engine/verification.rs'
      - 'src/db.rs'
      - 'src/engine/native_replay.rs'
      - 'src/engine/native_evidence.rs'
      - 'src/engine/improve.rs'
      - 'src/engine/native_adjudication.rs'
      - 'src/engine/native_agent.rs'
      - 'src/engine/native_model.rs'
      - 'src/engine/native_stream.rs'
      - 'src/engine/skill_discovery.rs'
      - 'src/engine/mod.rs'
      - 'src/engine/tools.rs'
      - 'src/engine/skills.rs'
      - 'src/engine/program.rs'
      - 'src/engine/algorithms.rs'
      - 'src/engine/adaptation_loop.rs'
      - 'src/engine/code_index.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sub3-product-acceptance
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Harness and product contract tests (dev profile only)
        run: |
          node scripts/check-lean-product.mjs
          test ! -d crates/harness
          ! grep -q 'dominion-harness' Cargo.toml
          ! grep -q 'dominion_harness::' src/api/sdk.rs
          # A successful Rust build must not resurrect extra paid reviewer
          # calls or a second unversioned tool selector in the chat runtime.
          ! grep -Fq 'review_action(' src/engine/chat/runtime/turn.rs
          ! grep -Fq 'review_action(' src/engine/chat/runtime/planning.rs
          grep -Fq 'pub use tool_discovery::tool_relevance;' crates/dominion-agent-sdk/src/lib.rs
          grep -Fq 'dominion_agent_sdk::tool_relevance(' src/engine/chat/runtime/selection.rs
          cargo test --bin dominion-rust engine::skill_discovery::tests
          cargo test --bin dominion-rust engine::chat::runtime::capability::tests
          cargo test --bin dominion-rust planning_cost_tests
          cargo test --bin dominion-rust shared_sdk_relevance_ignores_tool_parameter_payload
          cargo test --bin dominion-rust engine::chat::tests
          cargo test --bin dominion-rust engine::verification
          cargo test --bin dominion-rust engine::native_adjudication::tests
          cargo test --bin dominion-rust db::tests
          cargo test --bin dominion-rust engine::native_evidence::tests
          cargo test --bin dominion-rust engine::native_replay::tests
          cargo test --bin dominion-rust api::native_replay::tests
          cargo test --bin dominion-rust engine::program::tests
          cargo test --bin dominion-rust engine::program::tests::refuted_verifier_cannot_be_bypassed_by_appending_unreachable_fix
          cargo test --bin dominion-rust engine::algorithms::tests
          cargo test --bin dominion-rust engine::adaptation_loop::tests
          cargo test --bin dominion-rust engine::chat::runtime::program::evidence_join_tests
          cargo test --bin dominion-rust engine::chat::runtime::program::recovery_tests
          cargo test --bin dominion-rust engine::native_adjudication::tests
          cargo test --bin dominion-rust engine::native_agent::tests
          cargo test --bin dominion-rust api::sdk::tests
          cargo test --test e2e native_job_prompt_runs -- --test-threads=1
