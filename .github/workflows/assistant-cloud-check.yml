name: Assistant cloud source checks
on:
  push:
    branches: [assistant-cloud-link, assistant-work-kernel, assistant-native-fcm]
    paths:
      - 'cloud/**'
      - '.github/workflows/assistant-cloud-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check cloud/src/index.js
          node --check cloud/src/assistant_link.js
          node --check cloud/src/assistant_socket.js
          node --check cloud/src/assistant_browser.js
          node --check cloud/src/assistant_work.js
          node --check cloud/src/assistant_playbook.js
          node --check cloud/src/assistant_push_delivery.js
          node --test cloud/tests/*.test.mjs
