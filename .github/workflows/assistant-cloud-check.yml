name: Assistant cloud source checks
on:
  push:
    branches: [assistant-cloud-link]
    paths:
      - 'cloud/**'
      - '.github/workflows/assistant-cloud-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check cloud/src/index.js
          node --check cloud/src/assistant_link.js
          node --check cloud/src/assistant_socket.js
          node --check cloud/src/assistant_browser.js
          node --test cloud/tests/app-auth.test.mjs cloud/tests/email-auth.test.mjs cloud/tests/assistant-socket.test.mjs cloud/tests/assistant-shared-auth.test.mjs cloud/tests/assistant-messages.test.mjs cloud/tests/assistant-google.test.mjs cloud/tests/assistant-search.test.mjs cloud/tests/assistant-browser.test.mjs
