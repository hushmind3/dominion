name: Sub4 SDK contract checks
on:
  push:
    branches: [dominion-sub4]
    paths:
      - 'crates/dominion-sdk/**'
      - 'crates/dominion-core/**'
      - 'crates/dominion-contracts/**'
      - 'crates/dominion-harness/**'
      - 'crates/dominion-extensions/**'
      - 'crates/dominion-algorithms/**'
      - 'packages/sdk-typescript/**'
      - 'src/api/sdk.rs'
      - 'src/api/providers/**'
      - 'tests/e2e/codex_and_sdk.rs'
      - 'src/engine/chat/runtime.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sub4-sdk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sub4-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-sdk:
    if: github.ref == 'refs/heads/dominion-sub4'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Independent Core, Harness, Algorithm and Extension contracts
        run: cargo test --locked -p dominion-contracts -p dominion-harness -p dominion-algorithms -p dominion-extensions -p dominion-core --lib
      - name: Native embedding without HTTP dependencies
        run: cargo test --locked -p dominion-sdk --no-default-features
      - name: Public Rust SDK and HTTP contracts
        run: cargo test --locked -p dominion-sdk
      - name: Verify the product actually compiles with the embedded SDK
        run: cargo check --locked --bin dominion-rust
      - name: Backend SDK status and recovery contracts
        run: cargo test --locked --bin dominion-rust api::sdk::view_tests
      - name: External Rust client against the real product and scripted model
        run: cargo test --locked --test e2e external_rust_sdk_runs_real_product_with_approval_and_retry -- --nocapture
  typescript-sdk:
    if: github.ref == 'refs/heads/dominion-sub4'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: SDK build and consumer tests
        run: |
          npm install --prefix packages/sdk-typescript --no-audit --no-fund
          npm test --prefix packages/sdk-typescript
          cd packages/sdk-typescript
          npm pack --dry-run
