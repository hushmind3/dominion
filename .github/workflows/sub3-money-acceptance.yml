name: Sub3 Money Rust tests

on:
  push:
    branches: [dominion-sub3]
    paths:
      - '.github/workflows/sub3-money-acceptance.yml'
      - 'src/api/money*.rs'
      - 'src/engine/money*.rs'
      - 'src/engine/native_agent.rs'
      - 'src/engine/jobs.rs'
      - 'src/engine/tools.rs'
      - 'src/engine/mod.rs'
      - 'src/engine/plugins.rs'
      - 'src/db.rs'
      - 'src/db/money*.rs'
      - 'src/db/money_schema.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sub3-money-acceptance
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Money domain Rust tests (dev profile only)
        run: |
          cargo test --bin dominion-rust engine::money
          cargo test --bin dominion-rust api::money
          cargo test --bin dominion-rust db::money_implementation
          cargo test --bin dominion-rust engine::plugins
          cargo test --bin dominion-rust engine::jobs::tests
          cargo test --bin dominion-rust local_money_json_is_a_terminal_sdk_answer_without_new_model_calls
