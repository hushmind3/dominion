name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Full cross-platform release gate now validates dominion-sub3 as well.
# Only the latest commit on a branch needs a full release-mode validation.
# Superseded commits are cancelled instead of occupying the runner queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run build --prefix web
      - run: node scripts/check-lean-product.mjs
      - run: cargo test --release
      - name: Validate both TypeScript SDK public clients (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install --prefix sdk/typescript --no-package-lock --ignore-scripts --no-audit
          npm test --prefix sdk/typescript
          npm install --prefix packages/sdk-typescript --no-package-lock --ignore-scripts --no-audit
          npm run typecheck --prefix packages/sdk-typescript
          npm run build --prefix packages/sdk-typescript
