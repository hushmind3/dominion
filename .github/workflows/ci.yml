name: Release validation

# Full platform builds and release-mode tests run only for a release or an explicit manual request.
# Normal development pushes must not start a build/test matrix.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

# Keep one manually triggered release validation per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Supported product targets: Windows and macOS. Linux release tests are intentionally excluded.
jobs:
  release-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run test:refresh --prefix web
      - run: node web/node_modules/typescript/bin/tsc -p packages/sdk-typescript/tsconfig.json --noEmit
      - run: npm run build --prefix web
      - run: node scripts/check-runtime-architecture.mjs
      - run: cargo test --workspace --release
