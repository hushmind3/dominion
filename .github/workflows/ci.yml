name: Rust development tests

# Development only: test the touched Rust contracts in debug profile.
# Separate builds, cargo check, frontend and platform matrices belong to release.
on:
  push:
    branches: [dominion-sub2]
    paths:
      - 'src/**/*.rs'
      - 'tests/e2e.rs'
      - 'tests/e2e/**/*.rs'
      - 'web/src/**/*.ts'
      - 'web/src/**/*.tsx'
      - 'web/src/**/*.css'
      - 'web/vite.config.ts'
      - 'web/package*.json'
      - 'crates/**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'web/tests/**/*.mjs'
      - 'scripts/sub2-*.mjs'
      - 'sdk/typescript/**'
  pull_request:
    branches: [main, dominion-sub2]
    paths:
      - 'src/**/*.rs'
      - 'tests/e2e.rs'
      - 'tests/e2e/**/*.rs'
      - 'web/src/**/*.css'
      - 'web/vite.config.ts'
      - 'crates/**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'web/tests/**/*.mjs'
      - 'scripts/sub2-*.mjs'
      - 'sdk/typescript/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-regressions:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rust execution and provider/UI contract regressions (debug profile)
        run: |
          cargo test --lib engine::chat::trace_budget::tests
          # Context economics: replay a bloated real SQLite transcript as
          # source references, preserve exact on-demand evidence, and attribute
          # lifetime versus cleared-session usage without a production build.
          cargo test --lib engine::chat::context_window::tests
          cargo test --lib engine::chat::prompt_sources::tests
          cargo test --lib engine::chat::room_context::tests::group_agents_share_compact_owner_prefix_but_keep_distinct_personas
          cargo test --lib engine::chat::context::tests::long_real_owner_and_persona_are_source_indexed_not_56k_fixed_prefix
          cargo test --lib engine::chat::context::tests::multi_turn_architecture_does_not_rebuild_50k_context_from_cached_views
          cargo test --lib engine::chat::continuity::tests::private_followups_never_resurrect_prior_expensive_context
          cargo test --lib engine::chat::continuity::tests::replay_does_not_duplicate_tool_pairs_or_retain_revoked_knowledge
          cargo test --lib engine::chat::tool_projection::tests::priority_reserves_source_reader_under_tight_provider_schema_budget
          cargo test --lib engine::tools::tests::prompt_source_reader_rejects_stale_revisions_and_peer_persona
          cargo test --lib engine::chat::context::tests::full_sqlite_transcript_replays_as_small_current_context_without_data_loss
          cargo test --lib engine::tools::tests::historical_evidence_reader_paginates_exact_results_and_enforces_agent_scope
          cargo test --lib db::tests::session_usage_breakdown_keeps_lifetime_and_since_clear_separate
          cargo test --lib db::tests::indexed_recent_history_skips_archived_tool_dumps_and_preserves_order
          cargo test --lib db::tests::checkpointed_history_resumes_without_loading_archived_html
          cargo test --lib engine::chat::tool_schedule::tests
          # Evidence-delta completion gate is used by ordinary chat, not only SDK jobs.
          cargo test --lib engine::chat::runtime::action_review::tests
          # Sub2 agent kernel: terminal budget is an admission limit, not a
          # retroactive failure of already verified artifacts.
          cargo test --lib engine::autonomy::tests::frozen_owner_acceptance_contract_overrides_ambiguous_path_inference
          cargo test --lib api::jobs::harness_contract_tests
          cargo test -p dominion-agent-kernel --lib
          # Stop is a server-side cancellation, not a browser-only SSE abort.
          cargo test --lib engine::chat::tests::browser_stop_tombstone_precedes_late_chat_post_without_creating_messages
          cargo test --lib engine::chat::tests::browser_stop_preempts_model_with_no_output_and_next_turn_succeeds
          cargo test --lib engine::chat::runtime::cancellation_drain_tests
          # Stable same-room prefix and Cloudflare Workers AI opt-in affinity.
          cargo test --lib engine::chat::room_context::tests::identity_has_a_shared_stable_prefix_without_changing_owner_personas
          cargo test --lib engine::chat::continuity::tests::workers_ai_affinity_is_room_shared_and_cache_hint_uses_header_only
          cargo test --lib engine::chat::continuity::tests::opencode_go_affinity_is_auto_detected_only_for_the_real_go_endpoint
          cargo test --lib engine::chat::continuity::tests::same_persona_and_canonical_tools_keep_prefix_diagnostics_stable
          cargo test --lib engine::gateway::tests::helper_go_requests_have_stable_isolated_session_affinity
          # 2026-11-18 context efficiency: stable lazy skills and WebSocket
          # continuation horizon, with HTTP/provider context limits unchanged.
          cargo test --lib engine::chat::context::tests::skill_manifest_is_compact_sorted_and_never_embeds_full_instructions
          cargo test --lib engine::chat::context::tests::skill_previews_avoid_repeating_unrelated_descriptions_but_retain_ids
          cargo test --lib engine::models::tests::model_scanner_shares_one_bounded_walk_for_files_and_dirs
          cargo test --lib engine::models::tests::managed_gguf_and_registered_alias_are_shown_once_without_erasing_alias
          cargo test --lib engine::chat::context::tests::tool_reliability_context_is_bounded_deterministic_and_skipped_without_tools
          cargo test --lib engine::tools::tests::skill_read_requires_enabled_visible_skill_and_returns_original_body
          cargo test --lib engine::chat::continuity::tests::only_persistent_ws_enlarges_bounded_history_not_http_replay
          # Source audit: real skill pagination, WS->HTTP budget safety, and
          # event-driven native SDK waiter (not just compile-only coverage).
          cargo test --lib engine::chat::continuity::tests::a_committed_ws_transport_not_provider_kind_alone_admits_longer_history
          cargo test --lib sdk::tests::native_wait_wakes_on_matching_durable_event_and_stops_polling_idle_jobs
          cargo test --lib engine::chat::provider::tests::cache_usage_distinguishes_hit_from_missing_telemetry
          cargo test --lib engine::chat::provider::tests::codex_websocket_bootstraps_persona_once_as_developer_input
          cargo test --lib engine::chat::codex_ws::tests::developer_persona_is_wire_sent_once_and_rebased_on_revision
          cargo test --lib engine::chat::codex_ws::tests::codex_chain_contract_captures_tool_and_reasoning_changes_but_not_stream_flags
          cargo test --lib engine::chat::codex_ws::tests::changed_codex_request_contract_rebases_even_with_matching_history
          cargo test --lib engine::chat::codex_ws::tests::rebase_diagnostics_separate_window_eviction_from_modified_context
          # Shared room execution: cancelled epoch versus fresh owner, and
          # provider-wire input costs per participating agent.
          cargo test --lib engine::chat::room_context::tests::wire_profile_attributes_selected_messages_without_retaining_raw_text
          cargo test --lib engine::rooms::tests::fresh_owner_job_after_stop_uses_new_epoch_and_gets_a_real_reply
          cargo test --lib engine::rooms::tests::nine_participants_share_one_owner_message_and_all_speak
          cargo test --lib engine::rooms::tests::opt_in_readonly_agents_run_in_isolated_sessions_and_merge_once
          # Group-context efficiency with preserved owner/peer provenance.
          cargo test --lib engine::chat::room_context::tests::group_replay_keeps_committed_answer_but_not_prior_private_reasoning
          cargo test --lib engine::chat::room_context::tests::nine_speaker_long_prose_uses_profitable_peer_brief_and_preserves_sources
          # Sub2 group context: immutable peer IDs, lossless scoped source
          # retrieval, and no redundant index when full source is cached.
          cargo test --lib engine::chat::room_context::tests::nine_agents_retain_source_addressed_peer_coverage_without_nine_full_replays
          cargo test --lib engine::chat::room_context::tests::short_peer_index_keeps_exact_sources_without_repeated_receipt_metadata
          cargo test --lib engine::chat::runtime::action_review::tests::multi_file_contract_reuses_native_plan_but_preserves_explicit_planning
          cargo test --lib engine::chat::tool_projection::tests::local_docs_paths_do_not_activate_google_or_browser_tool_schemas
          cargo test --lib engine::chat::tool_projection::tests::canonical_tools_preserve_cache_prefix_across_mcp_registration_order
          cargo test --lib engine::chat::capability::tests::local_docs_paths_do_not_rank_cloud_schemas_in_native_discovery
          cargo test --lib engine::chat::capability::tests::discovery_receipt_never_echoes_full_mcp_schema_but_promotes_exact_original
          cargo test --locked -p dominion-turn-core --lib
          cargo test --locked -p dominion-agent-loop --lib
          cargo test --locked -p dominion-context-policy --lib
          cargo test --lib engine::tools::tests::room_source_reader_preserves_full_peer_history_and_private_scope
          cargo test --lib engine::chat::continuity::tests::indexed_peer_never_duplicates_a_full_reply_in_committed_prefix
          cargo test --lib engine::chat::continuity::tests::semantically_stable_room_state_reuses_one_frame_and_changed_state_appends
          cargo test --lib engine::chat::continuity::tests::recurring_room_status_is_reemitted_only_when_it_becomes_latest_again
          cargo test --lib engine::room_state::tests::shared_room_state_is_roster_driven_and_not_a_partial_speaker_window
          cargo test --lib engine::room_workboard::tests
          cargo test --lib engine::chat::room_context::tests::workboard_compiles_into_bounded_room_context_without_future_owner_leakage
          cargo test --lib engine::rooms::tests::routing_modes_respect_owner_selection_ids_and_real_mentions
          # The model-route and participant continuation pointers must commit
          # atomically; stale peer or obsolete-prefix replies cannot rewind them.
          cargo test --lib engine::chat::continuity::tests::stale_cross_route_completion_does_not_half_commit_model_cursor
          cargo test --lib engine::chat::continuity::tests::stale_same_route_and_obsolete_prefix_cannot_rewind_cursors
          cargo test --lib engine::chat::room_context::tests::explicit_exact_quote_request_never_compacts_peer_speech
          cargo test --lib engine::rooms::tests::nine_speakers_complete_three_owner_turns_without_false_completion
          cargo test --lib engine::verification::verified_patch_tests
          cargo test --lib engine::autonomy::tests::verifier_
          cargo test --lib engine::jobs::tests
          cargo test --lib db::tests::recovery_merge_guards_reject_stale_running_claim_across_connections
          cargo test --lib db::tests::independent_sqlite_connections_cannot_claim_same_queued_job
          cargo test --lib db::tests::stale_attempt_checkpoint_cannot_mutate_new_attempt_or_cancelled_job
          cargo test --lib db::tests::deferred_job_checkpoint_can_requeue_without_replaying_old_owner
          cargo test --lib db::tests::refunded_attempts_do_not_reauthorize_old_workers_from_prior_epochs
          cargo test --lib db::tests::audit_usage
          cargo test --lib db::tests::recovery
          # Sub2 native evidence, contrastive repair and completed-effect recovery.
          cargo test --lib engine::adaptation::probes::tests
          cargo test --lib engine::adaptation::trace_ir::tests
          cargo test --lib engine::adaptation::repair_tournament::tests
          cargo test --lib engine::adaptation_loop::selection_tests
          cargo test --lib engine::chat::runtime::candidate_rollout::tests
          # One native owner, optional external CLI adapter; no bundled runtime.
          cargo test --lib engine::tools::external_harness::tests
          cargo test --lib engine::tools::tests::native_runner_handles_stdin_and_bounds_stalled_input
          cargo test --lib engine::chat::runtime::harness_tool_selection_tests::external_harness_is_reachable_only_when_delegation_is_in_core
          cargo test --lib engine::chat::runtime::outcome_tests::nested_team_revision_failure_blocks_dependent_writer_and_parent_completion
          cargo test --lib engine::task_team_work::tests
          cargo test --lib engine::tools::team::tests
          cargo test --lib engine::tools::room_peer::tests
          cargo test --lib remote::tests
          cargo test --lib remote::worker::tests
          cargo test --lib api::executions::team_activity_tests
          cargo test --lib api::team_controls::tests
          cargo test --lib engine::tools::remote_artifacts::tests
          cargo test --lib engine::chat::runtime::outcome_tests::real_task_team_dag_persists_worker_claims_and_correlates_actual_tool_receipts
          cargo test --lib engine::resource_lock::tests
          cargo test --lib engine::effect::tests::external_harness_is_always_effectful
          cargo test --lib engine::chat::runtime::program::repair_completion_tests
          cargo test --lib engine::chat::runtime::program::review_settlement_tests
          cargo test --lib engine::chat::outcome::program_review_outcome_tests
          cargo test --lib db::tests::bounded_provenance_query_observes_only_requested_run_and_order
          # Execute the entire policy-selection suite; explicit owner activation
          # and preserved historical evidence must not regress.
          cargo test --lib engine::algorithms::tests
          cargo test --lib db::tests::algorithm_kind_query_is_indexed_and_excludes_unrelated_live_policies
          # Isolated native A/B runner: compile and validate frozen repair fixture.
          cargo test --bin dominion-benchmark
          # Boot the real Rust Axum binary against a scripted local model.
          # Verify HTTP room persistence and 9-speaker routing end to end.
          cargo test --test e2e persistent_room_http_flow_keeps_owner_once_and_shares_peer_context -- --test-threads=1
          cargo test --test e2e a_short_greeting_reaches_all_nine_when_the_turn_cap_covers_the_roster -- --test-threads=1
          # P0 acceptance: run the ACTUAL real-binary HTTP suite, not only
          # green library tests. The 2026-11-21 snapshot had 23 failures.
          # Wrong Host on owner GET, reused provider call IDs, and restore
          # failure injection must be part of the blocking product gate.
          cargo test --locked --test e2e -- --test-threads=1
          # Sub2 completion gate: execute the complete locked workspace lib suite,
          # not just selected green regressions that could hide the P0 five.
          cargo test --locked --workspace --lib -- --test-threads=2

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Main frontend typecheck, UI unit tests and API compatibility gate
        run: |
          npm ci --prefix web --ignore-scripts
          npm --prefix web run typecheck
          npm --prefix web run build
          # Development CI intentionally skips Vite production build.
          # Release packaging owns build artifacts; keep sub2 iterations fast.
          node --experimental-strip-types --test web/tests/*.test.mjs
          node scripts/sub2-source-audit.mjs
          node --test scripts/sub2-addon-boundary.test.mjs
          node --test scripts/sub2-core-boundary.test.mjs
          node --test scripts/sub2-architecture-contract.test.mjs
          node --test scripts/sub2-compare.test.mjs
          ./web/node_modules/.bin/tsc -p sdk/typescript/tsconfig.json
          node --test sdk/typescript/tests/sdk.test.mjs

  chromium-team-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install frontend and Chromium test browser
        run: |
          npm ci --prefix web --ignore-scripts
          ./web/node_modules/.bin/playwright install --with-deps chromium
      - name: Mobile Chromium Team controls and approval-status smoke
        run: |
          node web/tests/team-activity.smoke.mjs
          node web/tests/room-model-routing.smoke.mjs
          node web/tests/sse-gap.smoke.mjs
