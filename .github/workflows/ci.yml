name: CI

# Minimal branch CI: focused Money/kernel checks on macOS; compilation on Windows.
# Full release suites run separately when explicitly needed for a release.
on:
  push:
    branches: [dominion-sub2]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main, dominion-sub2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Windows Rust/test compilation
        if: matrix.os == 'windows-latest'
        run: cargo check --tests
      - uses: actions/setup-node@v4
        if: matrix.os == 'macos-latest'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        if: matrix.os == 'macos-latest'
        run: npm ci --prefix web
      - name: Frontend typecheck
        if: matrix.os == 'macos-latest'
        run: npm run typecheck --prefix web
      - name: Shared SDK compile
        if: matrix.os == 'macos-latest'
        run: node web/node_modules/typescript/bin/tsc -p sdk/typescript/tsconfig.json
      - name: Shared SDK contract tests
        if: matrix.os == 'macos-latest'
        run: node --test sdk/typescript/tests/sdk.test.mjs
      - name: Job scheduler / restart recovery regressions
        if: matrix.os == 'macos-latest'
        run: |
          cargo test --lib jobs::tests
          cargo test --lib db::tests::recovery
      - name: Money regression tests
        if: matrix.os == 'macos-latest'
        run: cargo test --lib money
      - name: Pure Rust decision kernel tests
        if: matrix.os == 'macos-latest'
        run: cargo test -p dominion-agent-kernel --lib
