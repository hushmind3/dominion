name: Dominion Cloud checks and deploy

on:
  pull_request:
    paths:
      - 'cloud/**'
      - 'web/src/components/DominionCloudAccount.tsx'
      - '.github/workflows/dominion-cloud.yml'
  push:
    branches: [branch4]
    paths:
      - 'cloud/**'
      - 'web/src/components/DominionCloudAccount.tsx'
      - '.github/workflows/dominion-cloud.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy configured Cloudflare Worker'
        type: boolean
        required: true
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Cloud Worker and email identity syntax
        run: |
          node --check cloud/src/index.js
          node --check cloud/src/email_auth.js
          node --check cloud/src/token_crypto.js
          node --check cloud/src/app_auth.js
          node --check cloud/src/connect_page.js
      - name: Verify gateway routing, paid-budget guards and single model circuit breaker
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          const code=fs.readFileSync('cloud/src/index.js','utf8')
          for(const marker of ['function paidModels(env)', 'async function routeCompletion(', 'async function availableModels(', 'Operator daily paid budget must be configured', "path === '/v1/models'", "path === '/v1/chat/completions'"]){
            assert.ok(code.includes(marker),'Missing gateway feature: '+marker)
          }
          assert.equal((code.match(/const modelFailures = new Map\(\)/g)||[]).length,1,'Duplicate model circuit breaker')
          EOF
      - name: Verify email magic-link security and D1 claim transactions
        run: node --test cloud/tests/*.test.mjs
      - name: Validate SQL and Worker configuration
        run: |
          python3 - <<'PY'
          import sqlite3, pathlib, tomllib
          db = sqlite3.connect(':memory:')
          db.executescript(pathlib.Path('cloud/schema.sql').read_text())
          assert {'accounts', 'sessions', 'usage', 'free_quota'}.issubset(
              {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")})
          conf = tomllib.loads(pathlib.Path('cloud/wrangler.toml').read_text())
          assert conf['name'] == 'dominion-cloud'
          print('Cloud syntax, schema and config OK')
          PY

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: dominion-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify required configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT"
          ! grep -q 'REPLACE_WITH_D1_DATABASE_ID' cloud/wrangler.toml
      - name: Deploy Worker
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
