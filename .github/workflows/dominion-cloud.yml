name: Dominion Cloud checks and deploy

on:
  pull_request:
    paths:
      - 'cloud/**'
      - '.github/workflows/dominion-cloud.yml'
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - '.github/workflows/dominion-cloud.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy configured Cloudflare Worker'
        type: boolean
        required: true
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Cloud Worker syntax
        run: node --check cloud/src/index.js
      - name: Validate SQL and Worker configuration
        run: |
          python3 - <<'PY'
          import sqlite3, pathlib, tomllib
          db = sqlite3.connect(':memory:')
          db.executescript(pathlib.Path('cloud/schema.sql').read_text())
          assert {'accounts', 'sessions', 'usage', 'free_quota'}.issubset(
              {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")})
          conf = tomllib.loads(pathlib.Path('cloud/wrangler.toml').read_text())
          assert conf['name'] == 'dominion-cloud'
          print('Cloud syntax, schema and config OK')
          PY

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: dominion-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify required configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT"
          ! grep -q 'REPLACE_WITH_D1_DATABASE_ID' cloud/wrangler.toml
      - name: Deploy Worker
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
