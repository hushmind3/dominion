name: Assistant repository migration bundle
on:
  push:
    branches: [dominion-sub3]
    paths:
      - '.github/workflows/sub3-assistant-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    if: github.ref == 'refs/heads/dominion-sub3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Export assistant source and host adapter references
        run: |
          set -eu
          mkdir -p export/dominion-assistant/host-reference
          cp -R plugins/dominion-voice/. export/dominion-assistant/
          cp src/api/plugins/personal_voice.rs src/api/plugins/recipe.rs src/api/plugins/bridge.rs export/dominion-assistant/host-reference/
          cp -R src/api/plugins/bridge export/dominion-assistant/host-reference/
          cp web/src/pages/extensions/PersonalVoicePanel.tsx export/dominion-assistant/host-reference/
          cp docs/plugin-package-v1.md export/dominion-assistant/
          printf '%s\n' "$GITHUB_SHA" > export/dominion-assistant/SOURCE_COMMIT
          cat > export/dominion-assistant/README.md <<'EOF'
          # DOMINION Assistant migration source
          This bundle preserves the prior voice service, tests and Android/iOS mobile source.
          The mobile app's personal LAN mode currently requires the DOMINION host adapter.
          host-reference contains the Rust and React integration reference; it is not standalone.
          Rebuild the assistant as an independent application against the common host SDK.
          Publish a real OCI image and a digest-pinned dominion-plugin.json before advertising it in the marketplace.
          No production release or cross-branch compatibility is claimed by this export.
          EOF
          python3 -m unittest discover -s export/dominion-assistant -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: dominion-assistant-migration-source
          path: export/dominion-assistant/
          if-no-files-found: error
          retention-days: 30
