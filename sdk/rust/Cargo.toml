[package]
name = "dominion-sdk"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Rust client SDK for the Dominion Rust agent harness"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
async-stream = "0.3"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
